name: C/C++ CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI environments frequently lack privileges / networking setup needed for integration tests.
  # net defaults to running network tests locally; in CI we disable them for determinism.
  NET_DISABLE_NETWORK_TESTS: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        config: [ debug, release ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Verify std.cppm location
        run: |
          if [ -f /usr/lib/llvm-21/share/libc++/v1/std.cppm ]; then
            echo "std.cppm found at /usr/lib/llvm-21/share/libc++/v1/std.cppm"
          else
            echo "Warning: std.cppm not found at expected location"
            find /usr/lib/llvm-21 -name "std.cppm" 2>/dev/null || echo "std.cppm not found anywhere"
          fi

      - name: Show compiler version
        run: clang++ --version

      - name: Build project
        run: ./tools/CB.sh ${{ matrix.config }} build

      - name: Run tests with JSONL output
        run: |
          set -euo pipefail
          ./tools/CB.sh ${{ matrix.config }} test -- --output=jsonl > test_results_${{ matrix.config }}.jsonl

      - name: Validate JSONL output
        run: |
          set -euo pipefail
          if [ ! -f "test_results_${{ matrix.config }}.jsonl" ]; then
            echo "ERROR: JSONL output file not found!"
            exit 1
          fi
          echo "JSONL lines: $(wc -l < "test_results_${{ matrix.config }}.jsonl")"
          if command -v jq >/dev/null 2>&1; then
            last_line="$(tail -1 "test_results_${{ matrix.config }}.jsonl")"
            echo "$last_line" | jq -e '.type == "eof"' >/dev/null
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.config }}
          path: test_results_${{ matrix.config }}.jsonl

  # Static analysis job
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup LLVM 21 toolchain with analysis tools
        uses: ./.github/actions/setup-llvm
        with:
          packages: "libc++-21-dev libc++abi-21-dev clang-21 clang-tools-21 cppcheck lld-21 lldb-21 jq libssl-dev"

      - name: Run clang-tidy on core files
        run: |
          # Run clang-tidy on key source files
          find . -name "*.c++" -o -name "*.c++m" | head -5 | xargs -I {} sh -c '
            echo "Analyzing {}"
            clang-tidy-21 {} -- -std=c++23 -I/usr/lib/llvm-21/include/c++/v1 2>/dev/null || true
          '

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --std=c++23 --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --quiet \
            YarDB/ deps/tester/tester/ 2>/dev/null || true

  # Submodule health check
  submodule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Check submodule status
        run: |
          echo "=== Submodule Status ==="
          git submodule status
          echo ""
          echo "=== Checking for uncommitted changes ==="
          if git status --porcelain | grep -q .; then
            echo "✗ Uncommitted changes found in main repo"
            git status --porcelain
            exit 1
          else
            echo "✓ Main repo is clean"
          fi

          # Check each submodule
          for submodule in $(git submodule | awk '{print $2}'); do
            echo "Checking $submodule..."
            if (cd "$submodule" && git status --porcelain | grep -q .); then
              echo "✗ Uncommitted changes in $submodule"
              (cd "$submodule" && git status --porcelain)
              exit 1
            else
              echo "✓ $submodule is clean"
            fi
          done
