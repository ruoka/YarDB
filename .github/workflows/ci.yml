name: C/C++ CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Only cancel superseded PR runs (force-pushes / rapid bot updates).
# Never cancel master/main — a new push must not abort an in-flight green check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI environments frequently lack privileges / networking setup needed for integration tests.
  # net defaults to running network tests locally; in CI we disable them for determinism.
  NET_DISABLE_NETWORK_TESTS: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        config: [ debug, release ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Verify commit and branch
        run: |
          echo "=== CI Build Information ==="
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "Commit SHA (short): $(git rev-parse --short HEAD)"
          echo "Commit message: $(git log -1 --pretty=%B)"
          echo "Branch: $(git branch --show-current || echo ${{ github.ref_name }})"
          echo "Commit date: $(git log -1 --format=%ci)"
          echo ""

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Verify std.cppm location
        run: |
          if [ -f /usr/lib/llvm-21/share/libc++/v1/std.cppm ]; then
            echo "std.cppm found at /usr/lib/llvm-21/share/libc++/v1/std.cppm"
          else
            echo "Warning: std.cppm not found at expected location"
            find /usr/lib/llvm-21 -name "std.cppm" 2>/dev/null || echo "std.cppm not found anywhere"
          fi

      - name: Show compiler version
        run: clang++ --version

      - name: Diagnostic - Check yar-details file and module discovery
        run: |
          echo "=== Checking yar-details.c++m file ==="
          ls -la YarDB/yar-details.c++m || echo "ERROR: yar-details.c++m not found"
          echo ""
          echo "=== All yar-*.c++m files ==="
          ls -la YarDB/yar-*.c++m || echo "No yar-*.c++m files found"
          echo ""
          echo "=== Build system module discovery (list) ==="
          ./tools/CB.sh ${{ matrix.config }} list | grep -E "yar.*details|yar.*odata" || echo "No yar:details or yar:odata modules found in list"
          echo ""
          echo "=== First 20 yar modules in build order ==="
          ./tools/CB.sh ${{ matrix.config }} list | grep -E "yar" | head -20 || echo "No yar modules found"

      - name: Build project
        run: ./tools/CB.sh ${{ matrix.config }} build

      # Scope to YarDB tests only — full suite includes deps/tester [jsonl-probe]
      # intentional-failure probes and hundreds of dependency tests.
      # --jobs forwards to test_runner for parallel top-level cases (HTTP fixtures
      # bind ephemeral ports so --jobs>1 is safe); --junit= writes an additive
      # xUnit report beside JSONL (see ruoka/tester CI).
      - name: Run tests (${{ matrix.config }})
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          echo "Running [yardb] tests with --jobs=${jobs}"
          ./tools/CB.sh ${{ matrix.config }} test --jsonl=failures --jobs="${jobs}" \
            --junit="test_results_${{ matrix.config }}.xml" \
            --tags='\[yardb\]' > "test_results_${{ matrix.config }}.jsonl"
          passed=$(jq -rs '[.[] | select(.type=="summary" or .type=="run_end")] | last | .passed' "test_results_${{ matrix.config }}.jsonl")
          if [ "$passed" != "true" ]; then
            echo "Tests failed (summary.passed=$passed)"
            tail -20 "test_results_${{ matrix.config }}.jsonl"
            exit 1
          fi
          echo "✓ Tests passed (jobs=${jobs})"

      - name: Validate JSONL output
        run: |
          set -euo pipefail
          f="test_results_${{ matrix.config }}.jsonl"
          if [ ! -f "$f" ]; then
            echo "ERROR: JSONL output file not found!"
            exit 1
          fi
          echo "JSONL lines ($f): $(wc -l < "$f")"
          if ! tail -1 "$f" | jq -e '.type == "eof"' >/dev/null; then
            echo "✗ EOF marker missing in $f — the stream was truncated"
            tail -5 "$f"
            exit 1
          fi
          echo "✓ EOF marker found"

      # show=all writes the test table into the job Summary on green runs too
      # (default show=fail leaves only a tiny SVG badge when everything passes).
      - name: Publish JUnit test summary
        uses: test-summary/action@v2
        if: always()
        with:
          show: all
          paths: test_results_${{ matrix.config }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.config }}
          path: |
            test_results_${{ matrix.config }}.jsonl
            test_results_${{ matrix.config }}.xml

  yarsh-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup LLVM (shared)
        uses: ./.github/actions/setup-llvm

      - name: Build debug binaries
        run: ./tools/CB.sh debug build

      - name: Run yarsh smoke tests
        run: |
          set -euo pipefail
          ./tests/yarsh/smoke.sh --jsonl | tee yarsh_smoke.jsonl
          grep '"type":"smoke_end"' yarsh_smoke.jsonl | tail -1 | grep -q '"passed":true'

      - name: Upload yarsh smoke results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yarsh-smoke-results
          path: yarsh_smoke.jsonl

  yardb-smoke:
