name: "setup-llvm"
description: "Install LLVM 21 + related tools (with caching). Accepts a space-separated list of apt packages."
inputs:
  packages:
    description: "Space-separated apt packages to install (default includes libc++, clang, lld, lldb, jq)"
    required: false
    default: "libc++-21-dev libc++abi-21-dev clang-21 lld-21 lldb-21 jq libssl-dev clang-tools-21"

runs:
  using: "composite"
  steps:
    # Snapshot lives under the runner tool cache (user-writable). Caching paths
    # under /usr fails on restore: tar cannot create root-owned symlinks
    # (Permission denied on clang++-21 → ../lib/llvm-21/bin/clang++).
    - name: Cache LLVM 21 toolchain snapshot
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/yardb-llvm-21
        key: llvm-21-snapshot-${{ runner.os }}-${{ runner.arch }}-v3

    - name: Ensure LLVM toolchain installed
      shell: bash
      env:
        LLVM_CACHE_ROOT: ${{ runner.tool_cache }}/yardb-llvm-21
        LLVM_PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail

        CACHE_FS="$LLVM_CACHE_ROOT/root"
        CACHE_MARKER="$LLVM_CACHE_ROOT/.yardb-llvm-complete"

        restore_from_cache()
        {
          if [[ ! -f "$CACHE_MARKER" || ! -d "$CACHE_FS" ]]; then
            return 1
          fi
          echo "Restoring LLVM 21 snapshot from cache into / ..."
          sudo cp -a "$CACHE_FS"/. /
          command -v clang++-21 >/dev/null 2>&1
        }

        snapshot_to_cache()
        {
          echo "Saving LLVM 21 snapshot into cache directory..."
          rm -rf "$LLVM_CACHE_ROOT"
          mkdir -p "$CACHE_FS"

          # Capture the llvm-21 prefix plus every file owned by the packages.
          # dpkg -L lists "/" for many packages — never copy that (would recurse
          # into CACHE_FS which lives under /opt/hostedtoolcache/...).
          pkgs=()
          read -r -a pkgs <<< "$LLVM_PACKAGES"
          {
            printf '%s\n' /usr/lib/llvm-21
            for pkg in "${pkgs[@]}"; do
              dpkg -L "$pkg" 2>/dev/null || true
            done
          } | sort -u | while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            case "$path" in
              /|/.|/..|.) continue ;;
            esac
            # Only snapshot concrete toolchain paths under /usr (and /etc if any).
            case "$path" in
              /usr/*|/etc/*) ;;
              *) continue ;;
            esac
            [[ -e "$path" || -L "$path" ]] || continue
            dest="$CACHE_FS$path"
            sudo mkdir -p "$(dirname "$dest")"
            sudo cp -a "$path" "$dest"
          done

          sudo chown -R "$(id -u):$(id -g)" "$LLVM_CACHE_ROOT"
          touch "$CACHE_MARKER"
          echo "Snapshot saved ($(du -sh "$LLVM_CACHE_ROOT" | awk '{print $1}'))."
        }

        if restore_from_cache; then
          echo "clang++-21 restored from cache; skipping apt install."
        else
          echo "clang++-21 not available from cache — installing LLVM 21 toolchain..."
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg ca-certificates lsb-release software-properties-common
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/apt-llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/apt-llvm.org.list > /dev/null
          sudo apt-get update -y
          # shellcheck disable=SC2086
          sudo apt-get install -y $LLVM_PACKAGES
          # Snapshot is best-effort: apt already succeeded; do not fail the job
          # if packing the cache hits a transient cp issue.
          if ! snapshot_to_cache; then
            echo "::warning::LLVM snapshot failed; clang is installed but cache will miss next run."
            rm -rf "$LLVM_CACHE_ROOT"
          fi
        fi

        if [[ -x /usr/bin/clang-21 ]]; then
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-21   100 || true
        fi
        if [[ -x /usr/bin/clang++-21 ]]; then
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100 || true
        fi
        if [[ -x /usr/bin/lld-21 ]]; then
          sudo update-alternatives --install /usr/bin/lld     lld     /usr/bin/lld-21     100 || true
        fi

        clang++-21 --version | head -1
        echo "LLVM setup complete."
