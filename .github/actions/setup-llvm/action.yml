name: "setup-llvm"
description: "Install LLVM 23 + related tools (with caching). Accepts a space-separated list of apt packages."
inputs:
  packages:
    description: "Space-separated apt packages to install (default includes libc++, clang, lld, lldb, jq)"
    required: false
    default: "libc++-23-dev libc++abi-23-dev clang-23 lld-23 lldb-23 jq libssl-dev clang-tools-23"

runs:
  using: "composite"
  steps:
    - name: Cache LLVM 23 + libc++
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          /usr/lib/llvm-23
          /usr/bin/clang-23
          /usr/bin/clang++-23
          /usr/bin/lld-23
          /usr/bin/lldb-23
          /usr/bin/clang-tidy-23
        key: llvm-23-ubuntu-${{ runner.arch }}-2026-v1
        restore-keys: |
          llvm-23-ubuntu-${{ runner.arch }}-
          llvm-23-ubuntu-
          llvm-23-

    - name: Ensure LLVM toolchain installed (install if missing)
      shell: bash
      run: |
        set -euo pipefail

        # If clang++-23 is present, skip install; otherwise install requested packages.
        if command -v clang++-23 >/dev/null 2>&1; then
          echo "clang++-23 found; skipping apt install."
        else
          echo "clang++-23 not found — installing LLVM 23 toolchain..."
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg ca-certificates lsb-release software-properties-common
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/apt-llvm.gpg
          # LLVM 23 is the apt.llvm.org development snapshot (unversioned suite).
          # There is no llvm-toolchain-${codename}-23 — use llvm-toolchain-${codename} + *-23 packages.
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/apt-llvm.org.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install -y ${{ inputs.packages }}
        fi

        # Ensure clang/clang++/lld alternatives point to the clang-23 binaries if present
        if [ -x /usr/bin/clang-23 ]; then
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-23   100 || true
        fi
        if [ -x /usr/bin/clang++-23 ]; then
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-23 100 || true
        fi
        if [ -x /usr/bin/lld-23 ]; then
          sudo update-alternatives --install /usr/bin/lld     lld     /usr/bin/lld-23     100 || true
        fi

        echo "LLVM setup complete."
